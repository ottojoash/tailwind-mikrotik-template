<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advertisement</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .advert {
            text-align: center;
        }
        .advert img {
            max-width: 100%;
        }
        .advert button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="advert">
        <h1>Your Ad Goes Here</h1>
        <img src="your-ad-image.jpg" alt="Advert Image" />
        <br><br>
        <button onclick="closeAdvert()">Close Ad & Continue</button>
    </div>

    <script>
        function closeAdvert() {
            window.close();  // Closes the popup window
        }
    </script>
</body>
</html>
