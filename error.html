<!DOCTYPE html>
<html lang="en">
<head>
    <title>Company Wi-Fi > Error</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" type="image/png" href="img/logo.png"/>
    <link rel="stylesheet" type="text/css" media="all" href="css/tailwind.min.css">
    <style>
        body {
            background-image: url('img/background.jpg'); /* Replace with your background image path */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .bg-transparent {
            background-color: transparent; /* Lower opacity */
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex flex-col items-center justify-center bg-transparent">
        <div class="flex flex-col border-gray-200 bg-white bg-opacity-60 border px-4 sm:px-6 md:px-8 lg:px-10 py-8 rounded-lg w-50 max-w-md">
            <div class="items-center flex justify-center">
                <img src="img/logo_transparent.png" alt="Home" class="h-auto w-2/5" />
            </div>
            <div class="w-full text-center">
                <div class="text-red-500 font-bold text-lg">Hotspot ERROR: $(error)</div>
                <p class="mt-4">
                    Login page: <a href="$(link-login)" class="text-blue-500 underline">$(link-login)</a>.
                </p>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="js/jquery.min.js"></script>
</body>
</html>
