<!DOCTYPE html>
<html lang="en">
<head>
    <title>Company Wi-fi > Logout</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="shortcut icon" type="image/png" href="img/logo_transparent.png"/>
    <link rel="stylesheet" type="text/css" media="all" href="css/tailwind.min.css">
    <style>
        body {
            background-image: url('img/background.jpg'); /* Replace with your background image path */
            background-size: cover;
            background-position: center;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.7); /* Transparent white */
            backdrop-filter: blur(10px); /* Frosted glass effect */
            border-radius: 10px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .form-container table {
            width: 100%;
        }
        .form-container td {
            padding: 10px;
        }
        .form-container .submit-btn {
            background-color: #4299e1; /* Blue background */
            color: white;
            padding: 10px;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 5px;
            width: 100%;
            transition: background-color 0.3s ease;
        }
        .form-container .submit-btn:hover {
            background-color: #3182ce; /* Darker blue on hover */
        }
    </style>
</head>
<body>
    <script language="JavaScript">
        function openLogin() {
            if (window.name != 'hotspot_logout') return true;
            open('$(link-login)', '_blank', '');
            window.close();
            return false;
        }
    </script>
    <div class="min-h-screen flex flex-col items-center justify-center">
        <div class="form-container">
            <div class="flex justify-center mb-4">
                <img src="img/logo_transparent.png" alt="Home" class="h-auto w-2/6" />
            </div>
            <div class="text-center mb-4">
                <div class="text-xs italic text-red-500">You have just logged out</div>
            </div>
            <form action="$(link-logout)" name="logout" onSubmit="return openLogout()">
                <table>
                    <tbody>
                        <tr>
                            <td class="text-gray-400 uppercase font-semibold">User name</td>
                            <td class="text-gray-800">$(username)</td>
                        </tr>
                        <tr>
                            <td class="text-gray-400 uppercase font-semibold">IP address</td>
                            <td class="text-gray-800">$(ip)</td>
                        </tr>
                        <tr>
                            <td class="text-gray-400 uppercase font-semibold">MAC address</td>
                            <td class="text-gray-800">$(mac)</td>
                        </tr>
                        <tr>
                            <td class="text-gray-400 uppercase font-semibold">Session time</td>
                            <td class="text-gray-800">$(uptime)</td>
                        </tr>
                        $(if session-time-left)
                        <tr>
                            <td class="text-gray-400 uppercase font-semibold">Time left</td>
                            <td class="text-gray-800">$(session-time-left)</td>
                        </tr>
                        $(endif)
                        <tr>
                            <td class="text-gray-400 uppercase font-semibold">Bytes up/down</td>
                            <td class="text-gray-800">$(bytes-in-nice) / $(bytes-out-nice)</td>
                        </tr>
                    </tbody>
                </table>
                <input class="submit-btn mt-4" type="submit" value="Log In" onClick="return openLogin()">
            </form>
        </div>
    </div>
    
    <script type="text/javascript" src="js/jquery.min.js"></script>
</body>
</html>
